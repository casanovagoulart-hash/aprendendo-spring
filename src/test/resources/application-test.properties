# Perfil de teste: usa H2 em memória em vez do PostgreSQL real.
# MODE=PostgreSQL faz o H2 entender a sintaxe SQL do Postgres, minimizando
# diferenças de comportamento entre o banco de testes e o de produção.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: cria o schema do zero a cada execucao de teste e derruba no final.
# Nunca usar "update" ou "create-drop" em producao - aqui e seguro porque
# o banco e efemero, existe só durante os testes.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# jwt.secret aqui usa um valor fixo, só para os testes -
# nao depende da variavel de ambiente JWT_SECRET que so existe
# na sua Run Configuration do IntelliJ ou nos secrets do CI.
jwt.secret=test-secret-key-not-for-production-use-only

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.open-in-view=false